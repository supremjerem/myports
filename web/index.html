<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyPorts</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: Canvas;
        --fg: CanvasText;
        --muted: color-mix(in srgb, CanvasText 55%, Canvas);
        --line: color-mix(in srgb, CanvasText 15%, Canvas);
        --accent: #d64545;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          15px/1.4 -apple-system,
          system-ui,
          sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      #app {
        max-width: 560px;
        margin: 0 auto;
        padding: 24px 16px 64px;
      }
      header {
        display: flex;
        align-items: baseline;
        gap: 12px;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 20px;
        margin: 0;
      }
      .status {
        font-size: 12px;
        color: var(--muted);
      }
      .token-form {
        display: grid;
        gap: 8px;
        margin-bottom: 16px;
      }
      .token-form p {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
      }
      input,
      button {
        font: inherit;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--fg);
      }
      button {
        cursor: pointer;
      }
      .error {
        color: var(--accent);
        font-size: 13px;
        margin-bottom: 12px;
      }
      .empty {
        color: var(--muted);
        padding: 24px 0;
      }
      ul.ports {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      ul.ports li {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 4px;
        border-bottom: 1px solid var(--line);
      }
      .port {
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        min-width: 56px;
      }
      .meta {
        flex: 1;
        min-width: 0;
      }
      .name {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .sub {
        font-size: 12px;
        color: var(--muted);
      }
      button.kill {
        border-color: var(--accent);
        color: var(--accent);
      }
      button.kill:disabled {
        opacity: 0.5;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
