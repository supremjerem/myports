name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Build & test (SwiftPM)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Swift version
        run: swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test --enable-code-coverage --parallel

      - name: Export coverage
        run: |
          BIN=$(swift build --show-bin-path)
          XCTEST=$(find "$BIN" -name '*.xctest' | head -1)
          PROF=$(find "$BIN/codecov" -name 'default.profdata' | head -1)
          xcrun llvm-cov export -format=lcov \
            "$XCTEST/Contents/MacOS/$(basename "$XCTEST" .xctest)" \
            -instr-profile "$PROF" \
            --ignore-filename-regex='(Tests|\.build)/' > coverage.lcov
        continue-on-error: true

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.lcov
        continue-on-error: true

  format:
    name: swift-format lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Lint
        run: swift format lint --strict --recursive Sources Tests Package.swift

  # apps job (xcodebuild for MyPorts-macOS / MyPorts-iOS) is added in Phase 2.
  # web job (npm ci / lint / build / test in web/) is added in Phase 3.
